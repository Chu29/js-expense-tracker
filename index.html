<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/index.css" />
    <title>Expense Tracker</title>
  </head>
  <body>
    <main class="app">
      <header class="header">FINANCE FLOW</header>
      <div class="account-data">
        <div class="balance">
          <h4>Your Balance</h4>
          <p class="amt"><span class="currency">F CAF</span>30,000</p>
        </div>
        <div class="income-expense-ctn">
          <div class="income">
            <h4>Income</h4>
            <p class="amt"><span class="currency">F CAF</span>85,500</p>
          </div>
          <div class="expense">
            <h4>Expense</h4>
            <p class="amt"><span class="currency">F CAF</span>55,500</p>
          </div>
        </div>
        <form class="new-transaction">
          <fieldset>
            <legend>New Transaction</legend>
            <div class="nt-input">
            <input type="text" class="nt-description" placeholder="Description"/>
            <input type="text" class="nt-amount" placeholder="Amount"/>
          </div>
          <div class="toggle-transaction">
            <div class="income">
              <input type="radio" name="" id="" value="income" />
              <label for="income">Income</label>
            </div>
            <div class="expense">
              <input type="radio" name="" id="" value="expense" />
              <label for="expense">Expense</label>
            </div>
          </div>
          <button class="add-btn">Add Transaction</button>
          </fieldset>
        </form>
        <div class="recent-transaction">
          <p>Recent Transaction</p>
          
        </div>
      </div>
      <div class="recent-transaction"></div>
    </main>
    <script src="scripts/app.js"></script>
  </body>
</html>
