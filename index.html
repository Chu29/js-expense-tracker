<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;400;700&display=swap"
      rel="stylesheet"
    />
    <title>Expense Tracker</title>
  </head>
  <body>
    <header class="header">
      <div class="top">
        <h1>FLOW</h1>
        <div class="acc-balance">
          <h4>Your Balance</h4>
          <p class="amt"><span class="currency">$</span>30,000</p>
        </div>
      </div>
    </header>
    <main class="app">
      <div class="account-data">
        <div class="income-expense-ctn">
          <div class="income">
            <h4>Income</h4>
            <p class="amt"><span class="currency">$</span>85,500</p>
          </div>
          <div class="expense">
            <h4>Expense</h4>
            <p class="amt"><span class="currency">$</span>55,500</p>
          </div>
        </div>
      </div>
      <form class="new-transaction">
        <fieldset>
          <legend>New Transaction</legend>
          <div class="nt-input">
            <input
              type="text"
              class="nt-description"
              placeholder="Description"
            />
            <input type="text" class="nt-amount" placeholder="Amount" />
          </div>
          <div class="toggle-transaction">
            <div class="t-income">
              <input
                type="radio"
                name="toggle"
                id="toggle-income"
                value="income"
              />
              <label for="toggle-income">Income</label>
            </div>
            <div class="t-expense">
              <input
                type="radio"
                name="toggle"
                id="toggle-expense"
                value="expense"
              />
              <label for="toggle-expense">Expense</label>
            </div>
          </div>
          <button class="add-btn">Add Transaction</button>
        </fieldset>
      </form>
      <div class="recent-transaction">
        <fieldset>
          <legend>Recent Transactions</legend>
          <div class="rt-transaction">
            <p class="desc">Salary</p>
            <p class="value">$10,000</p>
            <div class="del-btn">
              <svg
                height="20"
                width="20"
                viewBox="0 0 16 16"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M2 5v10c0 .55.45 1 1 1h9c.55 0 1-.45 1-1V5H2zm3 9H4V7h1v7zm2 0H6V7h1v7zm2 0H8V7h1v7zm2 0h-1V7h1v7zm2.25-12H10V.75A.753.753 0 0 0 9.25 0h-3.5A.753.753 0 0 0 5 .75V2H1.75a.752.752 0 0 0-.75.75V4h13V2.75a.752.752 0 0 0-.75-.75zM9 2H6v-.987h3V2z"
                  fill="currentColor"
                />
              </svg>
            </div>
          </div>
        </fieldset>
      </div>
    </main>
    <script src="scripts/app.js"></script>
  </body>
</html>
